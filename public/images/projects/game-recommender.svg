<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1e1e1e"/>
    </linearGradient>
    <linearGradient id="controllerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e1e"/>
      <stop offset="100%" style="stop-color:#141414"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- Background pixel grid hint -->
  <pattern id="pixels" width="20" height="20" patternUnits="userSpaceOnUse">
    <rect width="20" height="20" fill="none" stroke="#121212" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#pixels)"/>
  <!-- Game controller body -->
  <!-- Main body rounded rect -->
  <rect x="390" y="220" width="420" height="240" rx="80" fill="url(#controllerGrad)" stroke="#2a2a2a" stroke-width="2.5"/>
  <!-- Left grip -->
  <ellipse cx="440" cy="430" rx="60" ry="50" fill="url(#controllerGrad)" stroke="#2a2a2a" stroke-width="2.5"/>
  <!-- Right grip -->
  <ellipse cx="760" cy="430" rx="60" ry="50" fill="url(#controllerGrad)" stroke="#2a2a2a" stroke-width="2.5"/>
  <!-- D-pad (left side) -->
  <rect x="455" y="295" width="16" height="50" rx="3" fill="#e94560" opacity="0.8"/>
  <rect x="438" y="312" width="50" height="16" rx="3" fill="#e94560" opacity="0.8"/>
  <!-- Action buttons (right side) — ABXY -->
  <circle cx="730" cy="305" r="12" fill="#e94560" opacity="0.7"/>
  <circle cx="754" cy="325" r="12" fill="#e94560" opacity="0.5"/>
  <circle cx="706" cy="325" r="12" fill="#e94560" opacity="0.5"/>
  <circle cx="730" cy="345" r="12" fill="#e94560" opacity="0.7"/>
  <!-- Button labels -->
  <text x="730" y="310" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0a0a0a" text-anchor="middle">Y</text>
  <text x="754" y="330" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0a0a0a" text-anchor="middle">B</text>
  <text x="706" y="330" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0a0a0a" text-anchor="middle">X</text>
  <text x="730" y="350" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0a0a0a" text-anchor="middle">A</text>
  <!-- Start/Select buttons -->
  <rect x="570" y="320" width="26" height="10" rx="5" fill="#333333"/>
  <rect x="604" y="320" width="26" height="10" rx="5" fill="#333333"/>
  <!-- Analog sticks -->
  <circle cx="490" cy="380" r="22" fill="#1a1a1a" stroke="#333333" stroke-width="2"/>
  <circle cx="490" cy="380" r="10" fill="#e94560" opacity="0.4"/>
  <circle cx="700" cy="380" r="22" fill="#1a1a1a" stroke="#333333" stroke-width="2"/>
  <circle cx="700" cy="380" r="10" fill="#e94560" opacity="0.4"/>
  <!-- Star rating / recommendation UI -->
  <text x="570" y="280" font-family="Arial, sans-serif" font-size="20" fill="#e94560" text-anchor="middle">★★★★★</text>
  <!-- Corner accents -->
  <line x1="0" y1="0" x2="80" y2="0" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="0" x2="0" y2="80" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1120" y2="675" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1200" y2="595" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <!-- Text -->
  <text x="600" y="558" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">Game Recommender</text>
  <text x="600" y="604" font-family="Arial, sans-serif" font-size="20" fill="#a0a0a0" text-anchor="middle" letter-spacing="1">LLM-Powered Game Discovery Engine</text>
</svg>
