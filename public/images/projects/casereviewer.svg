<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1e1e1e"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e1e"/>
      <stop offset="100%" style="stop-color:#141414"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- Background pattern -->
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1" fill="#1e1e1e"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <!-- Document shape - back -->
  <rect x="510" y="155" width="200" height="260" rx="6" fill="#161616" stroke="#2a2a2a" stroke-width="1.5"/>
  <!-- Document shape - front -->
  <rect x="490" y="170" width="220" height="270" rx="6" fill="url(#docGrad)" stroke="#333333" stroke-width="1.5"/>
  <!-- Folded corner -->
  <polygon points="690,170 690,210 650,170" fill="#0a0a0a"/>
  <line x1="650" y1="170" x2="690" y2="210" stroke="#333333" stroke-width="1.5"/>
  <!-- Document lines -->
  <rect x="515" y="230" width="140" height="3" rx="2" fill="#2a2a2a"/>
  <rect x="515" y="248" width="160" height="3" rx="2" fill="#2a2a2a"/>
  <rect x="515" y="266" width="130" height="3" rx="2" fill="#2a2a2a"/>
  <rect x="515" y="284" width="150" height="3" rx="2" fill="#2a2a2a"/>
  <rect x="515" y="302" width="120" height="3" rx="2" fill="#2a2a2a"/>
  <rect x="515" y="320" width="145" height="3" rx="2" fill="#2a2a2a"/>
  <rect x="515" y="338" width="100" height="3" rx="2" fill="#2a2a2a"/>
  <!-- Stamp/checkmark circle -->
  <circle cx="670" cy="370" r="55" fill="none" stroke="#e94560" stroke-width="3"/>
  <circle cx="670" cy="370" r="48" fill="none" stroke="#e94560" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Check mark -->
  <polyline points="642,370 660,390 702,348" fill="none" stroke="#e94560" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text inside stamp circle -->
  <text x="670" y="410" font-family="Arial, sans-serif" font-size="10" fill="#e94560" text-anchor="middle" letter-spacing="3">REVIEWED</text>
  <!-- Decorative elements -->
  <circle cx="220" cy="250" r="40" fill="none" stroke="#e94560" stroke-width="1" opacity="0.15"/>
  <circle cx="980" cy="420" r="30" fill="none" stroke="#e94560" stroke-width="1" opacity="0.15"/>
  <line x1="150" y1="150" x2="400" y2="150" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Corner accents -->
  <line x1="0" y1="0" x2="80" y2="0" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="0" x2="0" y2="80" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1120" y2="675" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1200" y2="595" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <!-- Text -->
  <text x="600" y="556" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">CaseReviewer</text>
  <text x="600" y="602" font-family="Arial, sans-serif" font-size="20" fill="#a0a0a0" text-anchor="middle" letter-spacing="1">AI-Powered Visa &amp; Legal Document Analysis</text>
</svg>
