<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1e1e1e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- Circular grid rings -->
  <circle cx="600" cy="320" r="220" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="600" cy="320" r="160" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="600" cy="320" r="100" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="600" cy="320" r="50" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Cross hairs -->
  <line x1="380" y1="320" x2="820" y2="320" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="600" y1="100" x2="600" y2="540" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Diagonal lines -->
  <line x1="444" y1="164" x2="756" y2="476" stroke="#161616" stroke-width="1"/>
  <line x1="756" y1="164" x2="444" y2="476" stroke="#161616" stroke-width="1"/>
  <!-- Compass needle -->
  <polygon points="600,175 592,320 600,340 608,320" fill="#e94560"/>
  <polygon points="600,465 592,320 600,300 608,320" fill="#444444"/>
  <!-- Compass center circle -->
  <circle cx="600" cy="320" r="18" fill="#1a1a1a" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="600" cy="320" r="6" fill="#e94560"/>
  <!-- Cardinal directions -->
  <text x="600" y="155" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#e94560" text-anchor="middle">N</text>
  <text x="600" y="498" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#666666" text-anchor="middle">S</text>
  <text x="367" y="327" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#666666" text-anchor="middle">W</text>
  <text x="833" y="327" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#666666" text-anchor="middle">E</text>
  <!-- Tick marks on outer ring -->
  <line x1="600" y1="100" x2="600" y2="112" stroke="#333333" stroke-width="2"/>
  <line x1="600" y1="528" x2="600" y2="540" stroke="#333333" stroke-width="2"/>
  <line x1="380" y1="320" x2="392" y2="320" stroke="#333333" stroke-width="2"/>
  <line x1="808" y1="320" x2="820" y2="320" stroke="#333333" stroke-width="2"/>
  <!-- Decorative orbit dots -->
  <circle cx="460" cy="200" r="5" fill="#e94560" opacity="0.4"/>
  <circle cx="770" cy="460" r="4" fill="#e94560" opacity="0.3"/>
  <circle cx="750" cy="190" r="3" fill="#ffffff" opacity="0.2"/>
  <!-- Corner accents -->
  <line x1="0" y1="0" x2="80" y2="0" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="0" x2="0" y2="80" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1120" y2="675" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1200" y2="595" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <!-- Text -->
  <text x="600" y="568" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">Personal Copilot</text>
  <text x="600" y="614" font-family="Arial, sans-serif" font-size="20" fill="#a0a0a0" text-anchor="middle" letter-spacing="1">AI Life &amp; Finance Planning Assistant</text>
</svg>
