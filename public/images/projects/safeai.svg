<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1e1e1e"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c0303f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.5"/>
  <!-- Shield shape -->
  <path d="M600 160 L720 220 L720 360 Q720 440 600 490 Q480 440 480 360 L480 220 Z" fill="url(#shieldGrad)" opacity="0.15" stroke="#e94560" stroke-width="2"/>
  <!-- Shield inner -->
  <path d="M600 200 L690 248 L690 348 Q690 410 600 448 Q510 410 510 348 L510 248 Z" fill="none" stroke="#e94560" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Lock icon inside shield -->
  <rect x="571" y="295" width="58" height="46" rx="4" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <path d="M580 295 L580 278 Q580 260 600 260 Q620 260 620 278 L620 295" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="600" cy="314" r="6" fill="#e94560"/>
  <rect x="597" y="318" width="6" height="10" rx="2" fill="#e94560"/>
  <!-- Decorative dots -->
  <circle cx="200" cy="150" r="3" fill="#e94560" opacity="0.4"/>
  <circle cx="280" cy="200" r="2" fill="#e94560" opacity="0.3"/>
  <circle cx="950" cy="520" r="3" fill="#e94560" opacity="0.4"/>
  <circle cx="1020" cy="460" r="2" fill="#e94560" opacity="0.3"/>
  <circle cx="160" cy="500" r="2" fill="#ffffff" opacity="0.15"/>
  <circle cx="1100" cy="180" r="2" fill="#ffffff" opacity="0.15"/>
  <!-- Corner accents -->
  <line x1="0" y1="0" x2="80" y2="0" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="0" x2="0" y2="80" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1120" y2="675" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1200" y2="595" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <!-- Text -->
  <text x="600" y="560" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">SafeAI</text>
  <text x="600" y="606" font-family="Arial, sans-serif" font-size="20" fill="#a0a0a0" text-anchor="middle" letter-spacing="1">Runtime Security for AI Agents</text>
</svg>
