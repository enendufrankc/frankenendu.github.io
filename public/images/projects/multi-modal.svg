<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1e1e1e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- Background grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131313" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <!-- Four overlapping squares representing text/image/audio/video modalities -->
  <!-- Text square (top-left) -->
  <rect x="430" y="175" width="160" height="160" rx="8" fill="#e94560" opacity="0.12" stroke="#e94560" stroke-width="2"/>
  <text x="472" y="240" font-family="monospace" font-size="13" fill="#e94560" opacity="0.8">Aa</text>
  <text x="456" y="262" font-family="monospace" font-size="11" fill="#e94560" opacity="0.6">Text</text>
  <!-- Image square (top-right) -->
  <rect x="610" y="175" width="160" height="160" rx="8" fill="#e94560" opacity="0.12" stroke="#e94560" stroke-width="2"/>
  <!-- Image icon -->
  <rect x="638" y="210" width="104" height="80" rx="4" fill="none" stroke="#e94560" stroke-width="1.5" opacity="0.8"/>
  <circle cx="660" cy="228" r="8" fill="#e94560" opacity="0.5"/>
  <polyline points="638,268 664,245 686,260 710,234 742,268" fill="none" stroke="#e94560" stroke-width="1.5" opacity="0.8"/>
  <!-- Audio square (bottom-left) -->
  <rect x="430" y="335" width="160" height="160" rx="8" fill="#e94560" opacity="0.12" stroke="#e94560" stroke-width="2"/>
  <!-- Audio waveform -->
  <line x1="458" y1="415" x2="458" y2="415" stroke="#e94560" stroke-width="3" opacity="0.8"/>
  <line x1="468" y1="400" x2="468" y2="430" stroke="#e94560" stroke-width="3" opacity="0.8"/>
  <line x1="478" y1="390" x2="478" y2="440" stroke="#e94560" stroke-width="3" opacity="0.8"/>
  <line x1="488" y1="405" x2="488" y2="425" stroke="#e94560" stroke-width="3" opacity="0.8"/>
  <line x1="498" y1="396" x2="498" y2="434" stroke="#e94560" stroke-width="3" opacity="0.8"/>
  <line x1="508" y1="408" x2="508" y2="422" stroke="#e94560" stroke-width="3" opacity="0.8"/>
  <line x1="518" y1="394" x2="518" y2="436" stroke="#e94560" stroke-width="3" opacity="0.8"/>
  <line x1="528" y1="410" x2="528" y2="420" stroke="#e94560" stroke-width="3" opacity="0.8"/>
  <line x1="538" y1="402" x2="538" y2="428" stroke="#e94560" stroke-width="3" opacity="0.8"/>
  <line x1="548" y1="415" x2="548" y2="415" stroke="#e94560" stroke-width="3" opacity="0.8"/>
  <!-- Video square (bottom-right) -->
  <rect x="610" y="335" width="160" height="160" rx="8" fill="#e94560" opacity="0.12" stroke="#e94560" stroke-width="2"/>
  <!-- Play button -->
  <circle cx="690" cy="415" r="36" fill="none" stroke="#e94560" stroke-width="2" opacity="0.8"/>
  <polygon points="680,401 680,429 710,415" fill="#e94560" opacity="0.7"/>
  <!-- Overlap area (center intersection) -->
  <rect x="610" y="335" width="160" height="0" fill="none"/>
  <!-- Connection lines between squares -->
  <line x1="590" y1="255" x2="610" y2="255" stroke="#e94560" stroke-width="2" opacity="0.5"/>
  <line x1="590" y1="415" x2="610" y2="415" stroke="#e94560" stroke-width="2" opacity="0.5"/>
  <line x1="510" y1="335" x2="510" y2="335" stroke="#e94560" stroke-width="2" opacity="0.5"/>
  <line x1="690" y1="335" x2="690" y2="335" stroke="#e94560" stroke-width="2" opacity="0.5"/>
  <!-- Center node -->
  <circle cx="600" cy="337" r="12" fill="#e94560" opacity="0.3" stroke="#e94560" stroke-width="2"/>
  <circle cx="600" cy="337" r="5" fill="#e94560"/>
  <!-- Corner accents -->
  <line x1="0" y1="0" x2="80" y2="0" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="0" x2="0" y2="80" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1120" y2="675" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1200" y2="595" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <!-- Text -->
  <text x="600" y="562" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">Multi-Modal Generator</text>
  <text x="600" y="608" font-family="Arial, sans-serif" font-size="20" fill="#a0a0a0" text-anchor="middle" letter-spacing="1">AI-Powered Content Creation Across Modalities</text>
</svg>
