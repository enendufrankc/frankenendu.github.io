<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1e1e1e"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c0303f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- Background subtle grid -->
  <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#161616"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <!-- Connection lines between nodes -->
  <!-- Main central connection -->
  <line x1="410" y1="310" x2="790" y2="310" stroke="#e94560" stroke-width="2.5" stroke-dasharray="8,5"/>
  <!-- Animated-look arrow -->
  <polygon points="785,302 800,310 785,318" fill="#e94560"/>
  <polygon points="415,318 400,310 415,302" fill="#e94560"/>
  <!-- Secondary connections -->
  <line x1="460" y1="260" x2="740" y2="180" stroke="#e94560" stroke-width="1" opacity="0.25" stroke-dasharray="5,6"/>
  <line x1="460" y1="360" x2="740" y2="440" stroke="#e94560" stroke-width="1" opacity="0.25" stroke-dasharray="5,6"/>
  <!-- Left Agent node -->
  <circle cx="370" cy="310" r="80" fill="#0e0e0e" stroke="#e94560" stroke-width="3"/>
  <circle cx="370" cy="310" r="65" fill="none" stroke="#e94560" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <!-- Left agent icon - brain/circuit -->
  <circle cx="370" cy="300" r="22" fill="none" stroke="#e94560" stroke-width="2"/>
  <line x1="348" y1="300" x2="355" y2="310" stroke="#e94560" stroke-width="1.5"/>
  <line x1="385" y1="295" x2="392" y2="285" stroke="#e94560" stroke-width="1.5"/>
  <line x1="370" y1="278" x2="370" y2="270" stroke="#e94560" stroke-width="1.5"/>
  <circle cx="348" cy="300" r="4" fill="#e94560"/>
  <circle cx="392" cy="285" r="4" fill="#e94560"/>
  <circle cx="370" cy="270" r="4" fill="#e94560"/>
  <text x="370" y="356" font-family="monospace" font-size="12" fill="#e94560" text-anchor="middle">Agent A</text>
  <!-- Right Agent node -->
  <circle cx="830" cy="310" r="80" fill="#0e0e0e" stroke="#e94560" stroke-width="3"/>
  <circle cx="830" cy="310" r="65" fill="none" stroke="#e94560" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <!-- Right agent icon -->
  <circle cx="830" cy="300" r="22" fill="none" stroke="#e94560" stroke-width="2"/>
  <line x1="808" y1="300" x2="815" y2="310" stroke="#e94560" stroke-width="1.5"/>
  <line x1="845" y1="295" x2="852" y2="285" stroke="#e94560" stroke-width="1.5"/>
  <line x1="830" y1="278" x2="830" y2="270" stroke="#e94560" stroke-width="1.5"/>
  <circle cx="808" cy="300" r="4" fill="#e94560"/>
  <circle cx="852" cy="285" r="4" fill="#e94560"/>
  <circle cx="830" cy="270" r="4" fill="#e94560"/>
  <text x="830" y="356" font-family="monospace" font-size="12" fill="#e94560" text-anchor="middle">Agent B</text>
  <!-- Message packet in transit -->
  <rect x="560" y="296" width="80" height="28" rx="6" fill="#e94560" opacity="0.15" stroke="#e94560" stroke-width="1.5"/>
  <text x="600" y="315" font-family="monospace" font-size="11" fill="#e94560" text-anchor="middle">msg: task</text>
  <!-- Satellite smaller nodes -->
  <circle cx="230" cy="200" r="24" fill="#0e0e0e" stroke="#333333" stroke-width="1.5"/>
  <circle cx="200" cy="420" r="20" fill="#0e0e0e" stroke="#333333" stroke-width="1.5"/>
  <circle cx="970" cy="200" r="24" fill="#0e0e0e" stroke="#333333" stroke-width="1.5"/>
  <circle cx="1000" cy="440" r="20" fill="#0e0e0e" stroke="#333333" stroke-width="1.5"/>
  <line x1="290" y1="200" x2="370" y2="280" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="220" y1="420" x2="340" y2="370" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="910" y1="200" x2="830" y2="280" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="980" y1="440" x2="860" y2="370" stroke="#1e1e1e" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Corner accents -->
  <line x1="0" y1="0" x2="80" y2="0" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="0" x2="0" y2="80" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1120" y2="675" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1200" y2="595" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <!-- Text -->
  <text x="600" y="558" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">Agent2Agent</text>
  <text x="600" y="604" font-family="Arial, sans-serif" font-size="20" fill="#a0a0a0" text-anchor="middle" letter-spacing="1">Multi-Agent Communication Protocol</text>
</svg>
