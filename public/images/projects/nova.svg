<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1e1e1e"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c0303f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- Radial pulse rings -->
  <circle cx="600" cy="310" r="180" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="600" cy="310" r="140" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="600" cy="310" r="100" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="600" cy="310" r="60" fill="none" stroke="#e94560" stroke-width="1" opacity="0.2"/>
  <!-- Medical cross -->
  <!-- Vertical bar -->
  <rect x="566" y="175" width="68" height="270" rx="10" fill="url(#crossGrad)" opacity="0.9"/>
  <!-- Horizontal bar -->
  <rect x="464" y="277" width="272" height="68" rx="10" fill="url(#crossGrad)" opacity="0.9"/>
  <!-- Cross highlight -->
  <rect x="566" y="175" width="34" height="270" rx="10" fill="#ffffff" opacity="0.06"/>
  <rect x="464" y="277" width="272" height="34" rx="10" fill="#ffffff" opacity="0.06"/>
  <!-- Heartbeat line -->
  <polyline points="150,390 280,390 310,390 330,330 350,450 370,310 390,390 420,390 560,390" fill="none" stroke="#e94560" stroke-width="2.5" opacity="0.4"/>
  <polyline points="640,390 780,390 810,390 830,330 850,450 870,310 890,390 920,390 1050,390" fill="none" stroke="#e94560" stroke-width="2.5" opacity="0.4"/>
  <!-- Document accent -->
  <rect x="180" y="200" width="100" height="130" rx="5" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="192" y="220" width="76" height="3" rx="1.5" fill="#2a2a2a"/>
  <rect x="192" y="234" width="60" height="3" rx="1.5" fill="#2a2a2a"/>
  <rect x="192" y="248" width="70" height="3" rx="1.5" fill="#2a2a2a"/>
  <rect x="192" y="262" width="50" height="3" rx="1.5" fill="#2a2a2a"/>
  <!-- Corner accents -->
  <line x1="0" y1="0" x2="80" y2="0" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="0" x2="0" y2="80" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1120" y2="675" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="675" x2="1200" y2="595" stroke="#e94560" stroke-width="2" opacity="0.6"/>
  <!-- Text -->
  <text x="600" y="558" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">Nova</text>
  <text x="600" y="604" font-family="Arial, sans-serif" font-size="20" fill="#a0a0a0" text-anchor="middle" letter-spacing="1">Healthcare Document Intelligence Platform</text>
</svg>
